

services:
  # Redis Service
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  # Enrollment Worker 
   # Enrollment Worker 
  enrollment-worker:
    build:
      context: .
      dockerfile: Dockerfile.enrollmentworker
    environment:
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    networks:
      - app-network

  # CSV Worker
  csv-worker:
    build:
      context: .
      dockerfile: Dockerfile.csvworker
    environment:
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge